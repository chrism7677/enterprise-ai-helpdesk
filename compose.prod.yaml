services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - helpdesk_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?ENTRA_TENANT_ID is required}
      ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:?ENTRA_API_CLIENT_ID is required}
      ENTRA_REQUIRED_SCOPE: ${ENTRA_REQUIRED_SCOPE:?ENTRA_REQUIRED_SCOPE is required}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:?VITE_ENTRA_CLIENT_ID is required}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:?VITE_ENTRA_TENANT_ID is required}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:?VITE_ENTRA_API_SCOPE is required}
        VITE_DEMO_EMPLOYEE_USERNAME: ${VITE_DEMO_EMPLOYEE_USERNAME:-}
        VITE_DEMO_EMPLOYEE_PASSWORD: ${VITE_DEMO_EMPLOYEE_PASSWORD:-}
        VITE_DEMO_IT_STAFF_USERNAME: ${VITE_DEMO_IT_STAFF_USERNAME:-}
        VITE_DEMO_IT_STAFF_PASSWORD: ${VITE_DEMO_IT_STAFF_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  helpdesk_prod_data:
