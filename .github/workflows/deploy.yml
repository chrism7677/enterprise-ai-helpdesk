name: Deploy production demo

on:
  push:
    tags:
      - "demo-*"

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: sqlite://
      ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000002
      ENTRA_API_CLIENT_ID: 00000000-0000-0000-0000-000000000001
      ENTRA_REQUIRED_SCOPE: access_as_user
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run backend tests
        run: pytest -v

      - name: Verify FastAPI application import
        run: python -c "import app.main"

  validate-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: /api
      VITE_ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000001
      VITE_ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000002
      VITE_ENTRA_API_SCOPE: api://00000000-0000-0000-0000-000000000001/access_as_user
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deploy:
    needs:
      - validate-backend
      - validate-frontend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_DIR: ${{ vars.APP_DIR }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      DEPLOY_REF: ${{ github.ref_name }}
    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          for variable_name in AWS_REGION EC2_INSTANCE_ID APP_DIR AWS_ROLE_ARN DEPLOY_REF; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing required deployment variable: $variable_name" >&2
              exit 1
            fi
          done
          if [[ "$DEPLOY_REF" != demo-* || "$DEPLOY_REF" == "demo-" ]]; then
            echo "Ref is not an allowed demo-* release tag: $DEPLOY_REF" >&2
            exit 1
          fi

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy exact tag through Systems Manager
        shell: bash
        run: |
          set -Eeuo pipefail

          bootstrap_script="$(cat <<'BOOTSTRAP'
          set -Eeuo pipefail

          APP_DIR="$(printf '%s' "${APP_DIR_B64:?APP_DIR_B64 is required}" | base64 --decode)"
          DEPLOY_REF="$(printf '%s' "${DEPLOY_REF_B64:?DEPLOY_REF_B64 is required}" | base64 --decode)"
          unset APP_DIR_B64 DEPLOY_REF_B64
          export APP_DIR DEPLOY_REF

          if [[ "$DEPLOY_REF" != demo-* || "$DEPLOY_REF" == "demo-" ]]; then
            echo "ERROR: DEPLOY_REF must be a demo-* release tag; received: $DEPLOY_REF" >&2
            exit 2
          fi

          if [[ ! -d "$APP_DIR/.git" ]]; then
            echo "ERROR: APP_DIR is not a Git checkout: $APP_DIR" >&2
            exit 1
          fi

          cd "$APP_DIR"

          if ! git check-ref-format "refs/tags/$DEPLOY_REF" >/dev/null 2>&1; then
            echo "ERROR: DEPLOY_REF is not a valid Git tag name: $DEPLOY_REF" >&2
            exit 2
          fi

          echo "Bootstrapping release tag $DEPLOY_REF as $(id -un)..."
          if ! git ls-remote --exit-code --tags origin "refs/tags/$DEPLOY_REF" >/dev/null 2>&1; then
            echo "ERROR: Release tag does not exist on origin: $DEPLOY_REF" >&2
            exit 1
          fi
          git fetch --tags --force origin

          if ! git show-ref --verify --quiet "refs/tags/$DEPLOY_REF"; then
            echo "ERROR: Release tag was not fetched: $DEPLOY_REF" >&2
            exit 1
          fi

          release_commit="$(git rev-parse --verify "refs/tags/$DEPLOY_REF^{commit}")"
          git checkout --detach "refs/tags/$DEPLOY_REF"

          if [[ "$(git rev-parse HEAD)" != "$release_commit" ]]; then
            echo "ERROR: Checked-out commit does not match release tag $DEPLOY_REF." >&2
            exit 1
          fi

          if [[ ! -f "$APP_DIR/deploy.sh" ]]; then
            echo "ERROR: Release tag does not contain deploy.sh: $DEPLOY_REF" >&2
            exit 1
          fi

          exec bash "$APP_DIR/deploy.sh"
          BOOTSTRAP
          )"

          bootstrap_payload="$(printf '%s' "$bootstrap_script" | base64 --wrap=0)"
          app_dir_payload="$(printf '%s' "$APP_DIR" | base64 --wrap=0)"
          deploy_ref_payload="$(printf '%s' "$DEPLOY_REF" | base64 --wrap=0)"

          printf -v remote_command \
            "printf '%%s' '%s' | sudo -u ubuntu -H env APP_DIR_B64='%s' DEPLOY_REF_B64='%s' bash" \
            "$bootstrap_payload" \
            "$app_dir_payload" \
            "$deploy_ref_payload"
          parameters="$(jq -cn --arg command "$remote_command" '{commands: [$command]}')"

          command_id="$(
            aws ssm send-command \
              --document-name AWS-RunShellScript \
              --targets "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
              --parameters "$parameters" \
              --comment "Deploy enterprise-ai-helpdesk $DEPLOY_REF" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "SSM command ID: $command_id"

          set +e
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID"
          waiter_status=$?
          set -e

          invocation_result="$(
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json
          )"

          echo "Remote standard output:"
          jq -r '.StandardOutputContent // empty' <<<"$invocation_result"
          echo "Remote standard error:"
          jq -r '.StandardErrorContent // empty' <<<"$invocation_result" >&2

          remote_status="$(jq -r '.Status' <<<"$invocation_result")"
          if [[ "$waiter_status" -ne 0 || "$remote_status" != "Success" ]]; then
            echo "Remote deployment failed with SSM status: $remote_status" >&2
            exit 1
          fi
