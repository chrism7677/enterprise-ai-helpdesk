services:
  db:
    image: pgvector/pgvector:pg17
    container_name: helpdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - helpdesk_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U helpdesk_user -d helpdesk"
        ]
      interval: 5s
      timeout: 5s
      retries: 10      

volumes:
  helpdesk_data:  

  